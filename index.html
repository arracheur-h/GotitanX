<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERREUR SYSTÈME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0000AA;
            font-family: 'Courier New', monospace;
            color: white;
            overflow: hidden;
            cursor: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .error-box {
            background: #0000AA;
            border: 2px solid white;
            padding: 40px;
            max-width: 800px;
            text-align: center;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        h1 {
            font-size: 48px;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .error-text {
            font-size: 20px;
            line-height: 1.8;
            margin: 20px 0;
        }

        .error-code {
            font-size: 16px;
            margin: 30px 0;
            color: #AAAAAA;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .press-key {
            margin-top: 40px;
            font-size: 24px;
            padding: 15px 30px;
            border: 2px solid white;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hidden {
            display: none;
        }

        .hacking-screen {
            width: 100%;
            height: 100vh;
            background: #000;
            color: #00FF00;
            padding: 20px;
            overflow-y: auto;
        }

        .terminal-line {
            margin: 2px 0;
            font-size: 14px;
        }

        .cursor-blink::after {
            content: '█';
            animation: blink 0.7s infinite;
        }

        .glitch {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- Écran d'erreur initial -->
    <div id="errorScreen" class="container">
        <div class="error-box glitch">
            <h1>☠ FATAL ERROR ☠</h1>
            <div class="error-text">
                SYSTÈME COMPROMIS<br>
                ACCÈS NON AUTORISÉ DÉTECTÉ<br>
                <span class="blink">*** VIOLATION DE SÉCURITÉ ***</span>
            </div>
            <div class="error-code">
                Error Code: 0x00000HACK<br>
                Status: 0xC000000F<br>
                Module: KERNEL_BREACH.sys
            </div>
            <div class="press-key">
                ▶ PRESS ANY KEY TO ESCAPE ◀
            </div>
        </div>
    </div>

    <!-- Écran de "hacking" -->
    <div id="hackingScreen" class="hacking-screen hidden">
        <canvas id="matrix" class="matrix-bg"></canvas>
        <div id="terminal"></div>
    </div>

    <script>
        const errorScreen = document.getElementById('errorScreen');
        const hackingScreen = document.getElementById('hackingScreen');
        const terminal = document.getElementById('terminal');

        // Détecter n'importe quelle touche
        document.addEventListener('keydown', function(e) {
            if (!errorScreen.classList.contains('hidden')) {
                errorScreen.classList.add('hidden');
                hackingScreen.classList.remove('hidden');
                startHacking();
            }
        });

        // Détecter le clic aussi
        document.addEventListener('click', function(e) {
            if (!errorScreen.classList.contains('hidden')) {
                errorScreen.classList.add('hidden');
                hackingScreen.classList.remove('hidden');
                startHacking();
            }
        });

        function startHacking() {
            const messages = [
                'Initializing system breach...',
                'Connecting to mainframe...',
                '[OK] Connection established',
                'Bypassing firewall protocols...',
                'Decrypting SSL certificates...',
                '[████████████████████] 100%',
                'Accessing database: TOP_SECRET.db',
                'Extracting files...',
                '> passwd.txt',
                '> nuclear_codes.exe',
                '> alien_secrets.pdf',
                '> illuminati_members.csv',
                '[WARNING] Intrusion detected!',
                'Deploying countermeasures...',
                'Rerouting through proxy servers...',
                '> Tokyo, Japan',
                '> Moscow, Russia',
                '> São Paulo, Brazil',
                '[OK] Identity masked',
                'Downloading classified data...',
                '[████████████████████] 100%',
                'Mission accomplished!',
                '',
                'HACK COMPLET! 😎',
                '',
                'PS: Ceci est évidemment un faux site pour rire! 🎭'
            ];

            let index = 0;

            function addLine() {
                if (index < messages.length) {
                    const line = document.createElement('div');
                    line.className = 'terminal-line';
                    
                    if (messages[index].includes('[OK]') || messages[index].includes('100%')) {
                        line.style.color = '#00FF00';
                    } else if (messages[index].includes('[WARNING]') || messages[index].includes('detected')) {
                        line.style.color = '#FF0000';
                    } else if (messages[index].includes('>')) {
                        line.style.color = '#00FFFF';
                    }
                    
                    line.textContent = messages[index];
                    terminal.appendChild(line);
                    
                    terminal.scrollTop = terminal.scrollHeight;
                    index++;
                    
                    const delay = Math.random() * 300 + 100;
                    setTimeout(addLine, delay);
                } else {
                    const cursor = document.createElement('div');
                    cursor.className = 'terminal-line cursor-blink';
                    cursor.textContent = 'root@hacker:~# ';
                    terminal.appendChild(cursor);
                }
            }

            // Effet Matrix en arrière-plan
            const canvas = document.getElementById('matrix');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const chars = '01';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function drawMatrix() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#0F0';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            setInterval(drawMatrix, 33);
            addLine();
        }
    </script>
</body>
</html>
