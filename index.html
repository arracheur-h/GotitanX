<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access - GitanX</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #ffb3d9;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            z-index: 999999;
        }

        /* Effet scanline */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 179, 217, 0.05) 0px,
                rgba(255, 179, 217, 0.05) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 999;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        /* Container principal */
        .terminal {
            padding: 20px;
            height: 100vh;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }

        .terminal::-webkit-scrollbar {
            width: 10px;
        }

        .terminal::-webkit-scrollbar-track {
            background: #000;
        }

        .terminal::-webkit-scrollbar-thumb {
            background: #ffb3d9;
        }

        /* Header du système */
        .header {
            border: 2px solid #ffb3d9;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 179, 217, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 179, 217, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 179, 217, 0.8); }
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ffb3d9;
        }

        .ip-display {
            font-size: 1.5em;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            margin: 10px 0;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        /* Lignes de code */
        .code-line {
            margin: 5px 0;
            padding-left: 20px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .code-line::before {
            content: '> ';
            color: #ffb3d9;
        }

        .success {
            color: #ffb3d9;
        }

        .warning {
            color: #ff66b3;
        }

        .error {
            color: #ff1493;
        }

        .info {
            color: #ffc0e0;
        }

        /* Barre de progression */
        .progress-bar {
            width: 100%;
            height: 20px;
            border: 1px solid #ffb3d9;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #ffb3d9;
            width: 0%;
            transition: width 0.5s;
            box-shadow: 0 0 10px #ffb3d9;
        }

        /* Données système */
        .system-data {
            border: 1px solid #ffb3d9;
            padding: 15px;
            margin: 20px 0;
            background: rgba(255, 179, 217, 0.05);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px;
        }

        .data-label {
            color: #ffc0e0;
        }

        .data-value {
            color: #ffb3d9;
            text-align: right;
        }

        /* Curseur clignotant */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 15px;
            background: #ffb3d9;
            animation: cursor-blink 0.7s infinite;
            margin-left: 5px;
        }

        @keyframes cursor-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Matrice style background */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .terminal {
                font-size: 12px;
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .ip-display {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <canvas class="matrix-bg" id="matrix"></canvas>
    
    <div class="terminal" id="terminal">
        <div class="header">
            <h1>╔═══════════════════════════════╗</h1>
            <h1>║   SYSTEM ACCESS - GitanX    ║</h1>
            <h1>╚═══════════════════════════════╝</h1>
            <div class="ip-display" id="target-ip">DETECTING TARGET...</div>
        </div>

        <div id="output"></div>
    </div>

    <script>
        // Configuration
        const output = document.getElementById('output');
        const targetIpElement = document.getElementById('target-ip');
        let ipAddress = 'UNKNOWN';

        // Obtenir l'IP
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ipAddress = data.ip;
                targetIpElement.textContent = `TARGET IP: ${ipAddress}`;
            } catch (error) {
                ipAddress = generateFakeIP();
                targetIpElement.textContent = `TARGET IP: ${ipAddress}`;
            }
        }

        // Générer une fausse IP
        function generateFakeIP() {
            return `${random(1, 255)}.${random(1, 255)}.${random(1, 255)}.${random(1, 255)}`;
        }

        // Fonction random
        function random(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Ajouter une ligne de code
        function addLine(text, className = '', delay = 0) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const line = document.createElement('div');
                    line.className = `code-line ${className}`;
                    line.textContent = text;
                    output.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                    resolve();
                }, delay);
            });
        }

        // Barre de progression
        function showProgress(label, duration = 2000) {
            return new Promise(resolve => {
                const container = document.createElement('div');
                container.innerHTML = `
                    <div class="code-line">${label}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-${Date.now()}"></div>
                    </div>
                `;
                output.appendChild(container);
                
                const progressFill = container.querySelector('.progress-fill');
                let progress = 0;
                const interval = setInterval(() => {
                    progress += random(5, 20);
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        setTimeout(resolve, 200);
                    }
                    progressFill.style.width = progress + '%';
                }, duration / 20);
                
                terminal.scrollTop = terminal.scrollHeight;
            });
        }

        // Données système
        function showSystemData() {
            const data = document.createElement('div');
            data.className = 'system-data';
            data.innerHTML = `
                <div class="data-row">
                    <span class="data-label">TARGET IP:</span>
                    <span class="data-value">${ipAddress}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">LOCATION:</span>
                    <span class="data-value">${generateFakeLocation()}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">PORT SCAN:</span>
                    <span class="data-value">${random(20, 65535)}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">PROTOCOL:</span>
                    <span class="data-value">TCP/IPv4</span>
                </div>
                <div class="data-row">
                    <span class="data-label">ENCRYPTION:</span>
                    <span class="data-value">AES-${random(128, 512)}</span>
                </div>
                <div class="data-row">
                    <span class="data-label">FIREWALL:</span>
                    <span class="data-value error">BYPASSED</span>
                </div>
            `;
            output.appendChild(data);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Générer localisation fake
        function generateFakeLocation() {
            const cities = ['Paris', 'Lyon', 'Marseille', 'Toulouse', 'Nice', 'Nantes', 'Bordeaux'];
            return `${cities[random(0, cities.length - 1)]}, FR`;
        }

        // Générer code hexadécimal
        function generateHexCode() {
            let hex = '0x';
            for (let i = 0; i < 8; i++) {
                hex += '0123456789ABCDEF'[random(0, 15)];
            }
            return hex;
        }

        // Générer hash
        function generateHash() {
            let hash = '';
            for (let i = 0; i < 32; i++) {
                hash += '0123456789abcdef'[random(0, 15)];
            }
            return hash;
        }

        // Séquence principale
        async function runSequence() {
            await addLine('╔════════════════════════════════════════╗', 'info', 100);
            await addLine('║  INITIALIZING SYSTEM ACCESS PROTOCOL  ║', 'info', 50);
            await addLine('╚════════════════════════════════════════╝', 'info', 50);
            await addLine('', '', 100);
            
            await addLine('Connecting to GitanX Network...', '', 100);
            await addLine('[OK] Connection established', 'success', 150);
            await addLine('', '', 50);
            
            await addLine('Scanning target...', 'warning', 100);
            await showProgress('IP Detection in progress...', 800);
            await addLine(`[OK] Target identified: ${ipAddress}`, 'success', 100);
            await addLine('', '', 50);
            
            await addLine('Running system diagnostics...', '', 100);
            await showProgress('Analyzing network protocols...', 1000);
            await addLine('[OK] Protocols analyzed', 'success', 100);
            await addLine('', '', 100);
            
            await addLine('Extracting system information...', '', 100);
            for (let i = 0; i < 10; i++) {
                await addLine(`Processing packet ${i + 1}/10: ${generateHexCode()}`, 'info', 50);
            }
            await addLine('[OK] Extraction complete', 'success', 100);
            await addLine('', '', 150);
            
            await addLine('═══════════ SYSTEM DATA ═══════════', 'info', 100);
            showSystemData();
            await addLine('', '', 300);
            
            await addLine('Establishing secure connection...', '', 100);
            await showProgress('Encryption handshake...', 900);
            await addLine('[OK] Secure tunnel established', 'success', 100);
            await addLine('', '', 100);
            
            await addLine('Bypassing security layers...', 'warning', 100);
            for (let i = 1; i <= 5; i++) {
                await addLine(`Layer ${i}: ${i % 2 === 0 ? '[BYPASSED]' : '[CRACKED]'}`, 'error', 80);
            }
            await addLine('[OK] All security layers bypassed', 'success', 150);
            await addLine('', '', 150);
            
            await addLine('Generating access codes...', '', 100);
            for (let i = 0; i < 15; i++) {
                await addLine(`CODE: ${generateHash()}`, 'info', 60);
            }
            await addLine('[OK] Access codes generated', 'success', 100);
            await addLine('', '', 150);
            
            await addLine('Injecting payload...', 'warning', 100);
            await showProgress('Upload progress...', 1200);
            await addLine('[OK] Payload injected successfully', 'success', 100);
            await addLine('', '', 150);
            
            await addLine('═══════════════════════════════════════', 'success', 100);
            await addLine('║     ACCESS GRANTED - GitanX v2.0    ║', 'success', 100);
            await addLine('═══════════════════════════════════════', 'success', 50);
            await addLine('', '', 150);
            
            await addLine(`System compromised at: ${new Date().toLocaleString()}`, 'error', 100);
            await addLine(`Target IP ${ipAddress} is now under surveillance`, 'error', 100);
            await addLine('', '', 300);
            
            // Boucle infinie de codes
            await addLine('Monitoring active... Press F5 to restart', 'warning', 100);
            infiniteCodeStream();
        }

        // Stream infini de codes
        function infiniteCodeStream() {
            setInterval(() => {
                const types = [
                    `[DATA] ${generateHexCode()} → ${generateHash().substring(0, 16)}`,
                    `[PACKET] Size: ${random(64, 1500)} bytes | Port: ${random(1024, 65535)}`,
                    `[TRAFFIC] ${ipAddress} → ${generateFakeIP()} [${random(100, 9999)} ms]`,
                    `[LOG] Access attempt from ${generateFakeIP()} - BLOCKED`,
                    `[SCAN] Detected ${random(1, 50)} active connections`
                ];
                addLine(types[random(0, types.length - 1)], 'info');
                
                // Limiter le nombre de lignes pour éviter le lag
                if (output.children.length > 100) {
                    output.removeChild(output.firstChild);
                }
            }, random(200, 800));
        }

        // Effet Matrix background
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ffb3d9';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // Redimensionner le canvas
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Empêcher la fermeture accidentelle
        window.addEventListener('beforeunload', (e) => {
            e.preventDefault();
            e.returnValue = 'System locked. Cannot exit.';
            return 'System locked. Cannot exit.';
        });
        
        // Bloquer les raccourcis clavier de fermeture
        document.addEventListener('keydown', (e) => {
            // Bloquer Alt+F4 (fermer la fenêtre)
            if (e.altKey && e.keyCode === 115) {
                e.preventDefault();
                return false;
            }
            // Bloquer Ctrl+W (fermer l'onglet)
            if (e.ctrlKey && e.keyCode === 87) {
                e.preventDefault();
                return false;
            }
            // Bloquer Ctrl+Q (quitter)
            if (e.ctrlKey && e.keyCode === 81) {
                e.preventDefault();
                return false;
            }
        });
        
        // Bloquer le clic droit
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        // Bloquer la sélection de texte
        document.addEventListener('selectstart', (e) => {
            e.preventDefault();
            return false;
        });

        // Lancer la séquence
        window.addEventListener('load', async () => {
            // Forcer le plein écran immédiatement
            const elem = document.documentElement;
            
            // Essayer toutes les méthodes de plein écran
            const enterFullscreen = () => {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen({ navigationUI: "hide" }).catch(err => {
                        console.log('Fullscreen error:', err);
                    });
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            };
            
            // Tentative immédiate
            enterFullscreen();
            
            // Réessayer sur n'importe quelle interaction
            document.addEventListener('click', enterFullscreen, { once: true });
            document.addEventListener('keydown', enterFullscreen, { once: true });
            
            // Détecter la sortie du plein écran et le remettre
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    setTimeout(enterFullscreen, 100);
                }
            });
            
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement) {
                    setTimeout(enterFullscreen, 100);
                }
            });
            
            // Empêcher Échap de sortir du plein écran
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27) {
                    e.preventDefault();
                    e.stopPropagation();
                    enterFullscreen();
                    return false;
                }
                // Bloquer F11 aussi
                if (e.key === 'F11' || e.keyCode === 122) {
                    e.preventDefault();
                    enterFullscreen();
                    return false;
                }
            }, true);
            
            await getIP();
            setTimeout(runSequence, 500);
        });
    </script>
</body>
</html>
